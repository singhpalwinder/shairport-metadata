[package]
name = "shairport-metadata"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
plist = "1.10.3"
realfft = "3.4"
rumqttc = { version = "0.25.1", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
